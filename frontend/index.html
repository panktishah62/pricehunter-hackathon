<!doctype html>

    <meta charset="UTF-8" />
    <!--
      Force HTTPS as early as possible. Some in-app browsers (notably the Google
      app / GSA) open a bare "gold.zwig.in" link over http://. The app then loads
      over HTTP and its API calls carry Origin: http://gold.zwig.in, which the API
      CORS allow-list (https only) rejects with a 400 preflight -> "Load failed".
      Redirecting before anything else loads keeps the origin on https.
    -->
    <script>
      (function () {
        if (location.protocol === 'http:' &&
            location.hostname !== 'localhost' &&
            location.hostname !== '127.0.0.1') {
          location.replace('https://' + location.host + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
